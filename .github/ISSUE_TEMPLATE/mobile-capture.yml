name: OTMN Mobile Capture
description: Quickly capture an OTMN idea, lead, subject, marketing thought, article idea, or task from a phone.
title: "[Mobile Capture] "
labels:
  - mobile-capture
body:
  - type: dropdown
    id: capture-type
    attributes:
      label: Capture Type
      description: What are you capturing?
      options:
        - Idea
        - Article / Content Idea
        - Lead / Contact
        - Marketing
        - Research / Subject
        - Link / Resource
        - Website / Project Task
        - General Note
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Quick Title
      description: Give the thought a short, memorable title.
      placeholder: "Example: Mobile capture could become a contributor tool"
    validations:
      required: true

  - type: textarea
    id: capture
    attributes:
      label: Capture
      description: Write the thought exactly as you have it. Don't worry about organizing it.
      placeholder: "What do you want OTMN to remember?"
      render: text
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source / Link (Optional)
      description: Where did this come from? Add a URL if one is relevant.
      placeholder: "https://..."
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority (Optional)
      options:
        - Normal
        - High
        - Low
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Mobile Capture v1.0:** Capture first. Organize later. No need to solve the idea here.
